name: 'Lumo WP Code Review'
description: >
  Run Lumo's WordPress/WooCommerce catch on PR-changed PHP/JS files.
  Posts a review comment per finding (propose + cite, never auto-fix).
  LOUD (CERTAIN + breaking version) → fails the check when fail_on_loud is true.
  SOFT (CONTEXT_DEPENDENT) → comment only, never fails.

author: 'UnleashWP'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  anthropic_api_key:
    description: >
      Optional. When set, Lumo adds an autonomous WordPress-engineer review of
      the diff as one advisory PR comment, grounded on the rule engine's
      findings. Never affects the exit code. Pass it from a repository secret;
      without it this stage is skipped entirely.
    default: ''
  claude_model:
    description: >
      Model for the autonomous review stage. Only read when anthropic_api_key
      is set.
    default: 'claude-sonnet-5'
  fail_on_loud:
    description: >
      Fail the check (exit 1) when at least one LOUD catch fires.
      Set to "false" to comment-only on every finding without blocking the PR.
    required: false
    default: 'true'

  lumo_pro_url:
    description: >
      Base URL of a licensed Lumo Pro MCP server
      (e.g. https://lumo.yourdomain.com). When provided together with
      lumo_license_key, the runner calls the Pro catch instead of the free one.
      MVP: Pro path is a stub that errors gracefully if the server is unreachable.
    required: false
    default: ''

  lumo_license_key:
    description: >
      Lemon Squeezy license key for Lumo Pro. Required when lumo_pro_url is set.
      Pass as a secret: ${{ secrets.LUMO_LICENSE_KEY }}.
    required: false
    default: ''

  version:
    description: >
      Version of the @unleashwp/lumo npm package to run. Defaults to the
      latest published release; pin it (e.g. "0.3.0") for reproducible CI.
    required: false
    default: 'latest'

# Composite, not a node20 action pointing at dist/action.mjs: `dist/` is
# gitignored, so it is absent from every git tag — `uses: unleash-wp/lumo@v0.3.0`
# would fail with "file not found". Pulling the published npm package keeps the
# repo free of committed build output and makes the pinned version explicit.
runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run the Lumo catch
      shell: bash
      env:
        INPUT_FAIL_ON_LOUD: ${{ inputs.fail_on_loud }}
        INPUT_LUMO_PRO_URL: ${{ inputs.lumo_pro_url }}
        INPUT_LUMO_LICENSE_KEY: ${{ inputs.lumo_license_key }}
      run: npx -y -p "@unleashwp/lumo@${{ inputs.version }}" lumo action
