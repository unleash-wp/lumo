name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Typecheck + Test
    # Stays on GitHub-hosted runners, deliberately. This repository is PUBLIC:
    # a pull_request workflow runs a stranger's code, and on our own runner that
    # is our filesystem, our SSH agent and our deploy key. See lumo-pro's
    # docs/self-hosted-runner.md. Do not add the RUNNER_LABEL switch here -- it
    # also reads organisation variables, so it would move this repo too.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Vocabulary check
        run: npm run check:vocabulary

      - name: Lint the WordPress plugin
        run: for f in wordpress-plugin/lumo.php wordpress-plugin/includes/*.php; do php -l "$f"; done

      - name: Test
        run: npm test

      - name: Build MCP server
        run: npm run build

      - name: Smoke test MCP server
        run: node scripts/mcp-smoke-test.mjs

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.185

      - name: Validate plugin manifest
        run: claude plugin validate . --strict
