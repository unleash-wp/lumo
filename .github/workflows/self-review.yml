# Lumo checks its own pull requests with its own engine.
#
# Deliberately NOT the licensed CI gate. That gate is a Lumo Pro feature and
# needs a licence key, and this is the free repository: no key belongs here.
# What this job runs is the engine: the same free catch a user gets from
# `lumo scan`, run over the changes in the pull request.
#
# It reports and never blocks, exactly like the local scan: findings are in the
# job log, the check stays green.
#
# It is not the customer-facing CI gate. That one is Lumo Pro, lives in
# unleash-wp/lumo-action, and needs a licence, which this repository must not
# carry. What runs here is the branch's own engine, against the branch.

name: Self review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  self-review:
    name: WordPress/WooCommerce catch (this branch)
    # Stays on GitHub-hosted runners, deliberately. This repository is PUBLIC:
    # a pull_request workflow runs a stranger's code, and on our own runner that
    # is our filesystem, our SSH agent and our deploy key. See lumo-pro's
    # docs/self-hosted-runner.md. Do not add the RUNNER_LABEL switch here -- it
    # also reads organisation variables, so it would move this repo too.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The scan diffs against the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Scan the changes in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # `lumo scan` reads `git diff HEAD`, so move HEAD back to the merge
          # base: the pull request's changes become staged changes it can see.
          git reset --soft "$BASE_SHA"
          node dist/scan.mjs
