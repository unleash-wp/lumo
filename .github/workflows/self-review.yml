# Lumo checks its own pull requests with its own engine.
#
# Deliberately NOT the licensed CI gate. That gate is a Lumo Pro feature and
# needs a licence key, and this is the free repository — no key belongs here.
# What this job dogfoods is the engine: the same free catch a user gets from
# `lumo scan`, run over the changes in the pull request.
#
# It reports and never blocks, exactly like the local scan: findings are in the
# job log, the check stays green. The customer-facing CI example lives in
# docs/ci/github-action-example.yml.

name: Self review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  self-review:
    name: WordPress/WooCommerce catch (this branch)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The scan diffs against the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Scan the changes in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # `lumo scan` reads `git diff HEAD`, so move HEAD back to the merge
          # base: the pull request's changes become staged changes it can see.
          git reset --soft "$BASE_SHA"
          node dist/scan.mjs
